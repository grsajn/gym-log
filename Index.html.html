<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="theme-color" content="#E7EAEE">
<title>Gym Log</title>
<style>
:root{
  --bg:#E7EAEE; --surface:#FFFFFF; --ink:#16202E; --muted:#5B6675; --line:#D2D7DE;
  --a:#1E4FA3; --b:#C62828; --c:#E2A900; --done:#2E7D32; --done-bg:#E6F2E7;
  --r-sm:10px; --r-md:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:17px;line-height:1.4;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 96px);font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:12px 16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--a);outline-offset:2px}
h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:18px 0 2px}
h2{font-size:22px;font-weight:700;margin:28px 0 10px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px}
.week{display:flex;gap:6px;margin:0 0 22px;align-items:center;color:var(--muted);font-size:15px}
.pip{width:26px;height:8px;border-radius:4px;background:var(--line)}
.pip.on{background:var(--ink)}

/* plate tiles */
.plates{display:grid;gap:10px}
.plate{display:flex;align-items:center;gap:16px;background:var(--surface);border-radius:var(--r-md);padding:14px 16px;text-align:left;width:100%}
.disc{flex:none;width:58px;height:58px;border-radius:50%;background:var(--pc);display:grid;place-items:center;
  box-shadow:inset 0 0 0 6px rgba(255,255,255,.18), inset 0 0 0 20px var(--pc), inset 0 0 0 23px rgba(0,0,0,.18);
  color:#fff;font-weight:800;font-size:22px}
.disc.c{color:var(--ink)}
.plate strong{display:block;font-size:18px}
.plate span{color:var(--muted);font-size:14px;display:block}
.resume{display:block;width:100%;background:var(--ink);color:#fff;border-radius:var(--r-md);padding:16px;text-align:left;margin:0 0 14px}
.resume span{opacity:.75;font-size:14px;display:block}

.hist{background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.hist button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 16px;text-align:left;border-bottom:1px solid var(--line)}
.hist button:last-child{border-bottom:0}
.hist .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:1px}
.hist small{color:var(--muted)}
.empty{color:var(--muted);background:var(--surface);border-radius:var(--r-md);padding:16px;margin:0}

/* session */
.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 4px}
.back{color:var(--a);font-weight:600;padding:8px 0}
.title{display:flex;align-items:center;gap:12px;margin:8px 0 16px}
.title .disc{width:44px;height:44px;font-size:18px;box-shadow:inset 0 0 0 5px rgba(255,255,255,.18), inset 0 0 0 15px var(--pc), inset 0 0 0 17px rgba(0,0,0,.18)}
.title h1{margin:0;font-size:28px}
.ex{background:var(--surface);border-radius:var(--r-md);padding:14px 14px 10px;margin:0 0 12px}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex h3{margin:0;font-size:18px}
.target{color:var(--muted);font-size:15px;white-space:nowrap}
.focus{margin:2px 0 8px;color:var(--muted);font-size:14px}
.last{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;background:var(--bg);border-radius:var(--r-sm);padding:6px 6px 6px 10px;margin:0 0 8px}
.last button{color:var(--a);font-weight:600;padding:4px 8px}
.set{display:grid;grid-template-columns:22px 1fr auto 1fr 48px 30px;gap:6px;align-items:center;padding:4px 0}
.set.time,.set.reps{grid-template-columns:22px 1fr 48px 30px}
.num{color:var(--muted);font-size:14px;text-align:center}
.x{color:var(--muted);font-size:14px}
.field{position:relative}
.field input{width:100%;font:inherit;font-size:19px;font-weight:600;padding:10px 38px 10px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--ink);-webkit-appearance:none}
.field input::placeholder{color:#A5ADB8;font-weight:500}
.field em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:13px;pointer-events:none}
.tick{height:44px;border-radius:var(--r-sm);border:2px solid var(--line);font-size:20px;font-weight:700;color:transparent}
.set.done .tick{background:var(--done);border-color:var(--done);color:#fff}
.set.done .field input{background:var(--done-bg);border-color:transparent}
.del{color:#9AA3AE;font-size:22px;height:44px}
.add{color:var(--a);font-weight:600;padding:10px 0 4px}
.addex{display:flex;gap:8px;margin:4px 0 20px}
.addex input{flex:1;font:inherit;padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff}
.addex button{background:var(--surface);border-radius:var(--r-sm);padding:0 16px;font-weight:600;color:var(--a)}
.actions{display:grid;gap:10px;margin:8px 0 24px}
.primary{background:var(--ink);color:#fff;border-radius:var(--r-md);padding:16px;font-weight:700;font-size:18px}
.quiet{color:var(--b);padding:12px;font-weight:600}
.quiet.armed{background:var(--b);color:#fff;border-radius:var(--r-md)}

/* detail */
.dl{background:var(--surface);border-radius:var(--r-md);padding:4px 16px}
.dl div{padding:12px 0;border-bottom:1px solid var(--line)}
.dl div:last-child{border:0}
.dl small{display:block;color:var(--muted);font-size:15px}

/* timer */
#timer{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);max-width:536px;margin:0 auto;
  background:var(--ink);color:#fff;border-radius:var(--r-md);padding:12px 14px;display:none;align-items:center;gap:12px;
  box-shadow:0 8px 24px rgba(22,32,46,.3)}
#timer.show{display:flex}
#timer .t{font-size:28px;font-weight:800;flex:1}
#timer .t small{font-size:14px;font-weight:500;opacity:.7;margin-left:6px}
#timer button{background:rgba(255,255,255,.14);color:#fff;border-radius:var(--r-sm);padding:10px 12px;font-weight:600;font-size:15px}
#timer.over{background:var(--done)}
#sync{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:12px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:14px;background:var(--surface);color:var(--muted);z-index:8;box-shadow:0 1px 4px rgba(22,32,46,.12)}
#sync.ok{color:var(--done)}
#sync.err{background:var(--b);color:#fff}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:15px;display:none;z-index:9}

/* backup */
.backup{display:flex;gap:10px;margin-top:10px}
.backup button{flex:1;background:var(--surface);border-radius:var(--r-sm);padding:12px;font-weight:600;font-size:15px}
textarea{width:100%;min-height:140px;font:13px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;margin-top:10px}
.note{color:var(--muted);font-size:14px}
.month{font-size:15px;font-weight:600;color:var(--muted);margin:16px 0 6px}
.hist .meta{color:var(--muted);font-size:13px;display:block}
.chart{background:var(--surface);border-radius:var(--r-md);padding:12px 10px 6px;margin:0 0 12px}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-size:10px;fill:var(--muted);font-family:inherit}
.best{background:var(--surface);border-radius:var(--r-md);padding:14px 16px;margin:0 0 12px}
.best strong{font-size:24px;display:block}
.best span{color:var(--muted);font-size:14px}
.edit{background:var(--surface);color:var(--a);border-radius:var(--r-md);padding:14px;font-weight:600}
.day{background:var(--surface);border-radius:var(--r-md);padding:12px 14px 14px;margin:0 0 16px}
.day-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.day-head strong{font-size:18px}
.day-head button{width:40px;height:36px;font-size:24px;color:var(--a);border-radius:var(--r-sm)}
.day-head button:disabled{color:var(--line)}
.dayrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.dayrow .field input{padding-right:62px}
.habits{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.habit{border:2px solid var(--line);border-radius:var(--r-sm);padding:10px 4px;font-size:14px;font-weight:600;line-height:1.2}
.habit small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.habit[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:#fff}
.habit[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.checkin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.checkin div{background:var(--surface);border-radius:var(--r-md);padding:12px}
.checkin strong{display:block;font-size:20px}
.checkin span{color:var(--muted);font-size:12px;display:block}
.grid{background:var(--surface);border-radius:var(--r-md);padding:12px 14px;margin:0 0 12px}
.grow{display:grid;grid-template-columns:72px repeat(14,1fr) 38px;gap:3px;align-items:center;margin:4px 0}
.grow b{font-size:13px;font-weight:600}
.grow i{display:block;aspect-ratio:1;border-radius:3px;background:var(--bg)}
.grow i.on{background:var(--done)}
.grow em{font-style:normal;font-size:12px;color:var(--muted);text-align:right}
@media (prefers-reduced-motion:no-preference){ .set.done .tick{transition:background .15s} }
</style>
</head>
<body>
<div id="app"><p class="sub">Loading…</p></div>
<div id="timer" role="timer" aria-live="polite"><div class="t" id="tt">0:00</div><button data-t="add">+30 s</button><button data-t="skip">Done</button></div>
<div id="toast" role="status"></div>
<div id="sync" role="status" aria-live="polite"></div>

<script>
const PLAN = {
  A:{name:'Workout A', color:'var(--a)', ex:[
    ['Back squat','3 × 6–8','Main lift. Brace, sit between the hips.','lift',3,150],
    ['Bench press','3 × 6–8','Shoulder blades pinned, feet planted.','lift',3,150],
    ['Seated cable row','3 × 10–12','Pause with the handle at your ribs.','lift',3,90],
    ['Romanian deadlift','3 × 8–10','Hips back, bar close to the legs.','lift',3,90],
    ['Hanging knee raise','3 × 10–12','No swinging. Plank 3 × 45 s if grip is done.','reps',3,60],
    ['Bike intervals','8–10 min','30 s hard, 60 s easy.','time',1,0]]},
  B:{name:'Workout B', color:'var(--b)', ex:[
    ['Deadlift','3 × 5','Main lift. Conventional or trap bar. Reset each rep.','lift',3,150],
    ['Standing overhead press','3 × 6–8','Brace hard, no leaning back.','lift',3,120],
    ['Pull-ups or lat pulldown','3 × 6–10','Add weight once 3 × 10 pull-ups is easy.','lift',3,90],
    ['Walking lunges','3 × 10 / leg','Dumbbells in hands.','lift',3,90],
    ['Pallof press or woodchop','3 × 12 / side','Superset with face pulls.','lift',3,0],
    ['Face pulls','2 × 15','Balances the one-sided load from tennis.','lift',2,60],
    ['Rower intervals','6–8 rounds','30 s hard, 60 s easy.','time',1,0]]},
  C:{name:'Workout C', color:'var(--c)', ex:[
    ['Kettlebell swings','15 per round','Hip snap, arms just guide the bell.','lift',4,0],
    ['Push-ups','12–15 per round','Full range, chest to near floor.','reps',4,0],
    ['Goblet squats','12 per round','Moderate weight, keep moving.','lift',4,0],
    ["Farmer's carry",'40 m per round','Heavy, walk tall.','lift',4,0,'m'],
    ['Skater jumps','10 / side per round','Stick each landing. Rest 90 s after this.','reps',4,90],
    ['Incline walk','10 min','After the circuit.','time',1,0]]}
};

const KEY = 'gymlog-v1';
let state = {sessions:[], active:null, days:{}};
let dayOff = 0;
const HABITS = [['protein','Protein','160 g+'], ['steps','Steps','8k+'], ['sleep','Sleep','7 h+']];
const START_WEIGHT = 94;
const pad2 = n => String(n).padStart(2,'0');
const keyOf = d => d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
const dayKey = off => { const d = new Date(); d.setDate(d.getDate() + off); return keyOf(d); };
const dayDate = k => new Date(k + 'T12:00:00');
function latestBefore(field, key){
  const ks = Object.keys(state.days).filter(k => k < key && state.days[k][field]).sort();
  return ks.length ? state.days[ks[ks.length-1]][field] : '';
}
let view = {name:'home'};
let timer = {end:0, iv:null};
let armed = null, armTimer = null;
let audio = null;

/* storage: Claude artifact storage, or the browser's own storage when hosted elsewhere */
const store = {
  async get(){
    if (window.storage) {
      try { const r = await window.storage.get(KEY, false); return r ? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }
    try { const v = window['local'+'Storage'].getItem(KEY); return v ? JSON.parse(v) : null; } catch(e){ return null; }
  },
  async set(obj){
    const s = JSON.stringify(obj);
    if (window.storage) {
      try { const r = await window.storage.set(KEY, s, false); return r ? {ok:true} : {ok:false, err:'storage returned no result'}; }
      catch(e){ console.error(e); return {ok:false, err:(e && e.message) || String(e)}; }
    }
    try { window['local'+'Storage'].setItem(KEY, s); return {ok:true}; }
    catch(e){ return {ok:false, err:'no storage available here'}; }
  }
};
let saveT, saving = false, dirty = false, fails = 0, warned = false;
function setSync(kind){
  const el = document.getElementById('sync'); if (!el) return;
  el.className = kind === 'saved' ? 'ok' : kind === 'error' ? 'err' : '';
  el.textContent = kind === 'saved' ? 'Saved ✓' : kind === 'error' ? 'Not saved, retrying' : kind === 'saving' ? 'Saving…' : '';
}
function save(){ dirty = true; setSync('saving'); clearTimeout(saveT); saveT = setTimeout(flush, 1200); }
async function flush(){
  if (saving){ clearTimeout(saveT); saveT = setTimeout(flush, 600); return; }
  if (!dirty) return;
  saving = true; dirty = false;
  const snapshot = JSON.stringify(state);
  const res = await store.set(state);
  if (res.ok){
    const back = await store.get();              // read it back to prove it stuck
    if (!back || JSON.stringify(back) !== snapshot){ res.ok = false; res.err = 'check after saving failed'; }
  }
  saving = false;
  if (res.ok){
    setSync(dirty ? 'saving' : 'saved');
    fails = 0;
    if (warned){ warned = false; toast('Saved'); }
    if (dirty){ clearTimeout(saveT); saveT = setTimeout(flush, 1200); }
  } else {
    dirty = true; fails++; if (fails >= 2) setSync('error');
    clearTimeout(saveT); saveT = setTimeout(flush, Math.min(30000, 2000 * 2 ** (fails - 1)));
    if (fails === 4 && !warned){ warned = true; toast('Not saved yet (' + res.err + '). Still retrying.'); }
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && dirty){ clearTimeout(saveT); flush(); } });

const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const letter = k => k === 'X' ? '?' : k;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2200); }
function fmtDate(iso){ return new Date(iso).toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short'}); }
function ago(iso){
  const d = Math.floor((startOfDay(new Date()) - startOfDay(new Date(iso))) / 864e5);
  return d === 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago';
}
function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function weekStart(){ const d = startOfDay(new Date()); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return d; }

function newSet(){ return {w:'', r:'', v:'', done:false}; }
function newSession(key){
  return { id: Date.now().toString(36), key, start: new Date().toISOString(),
    ex: PLAN[key].ex.map(([n,t,f,k,sets,rest,u]) => ({n,t,f,k,rest,u:u||'reps', sets:Array.from({length:sets}, newSet)})) };
}
function lastFor(name){
  for (const s of state.sessions){
    if (state.active && s.id === state.active.id) continue;
    const e = s.ex.find(x => x.n === name); if (e && e.sets.some(hasData)) return e.sets.filter(hasData);
  }
  return null;
}
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? null : n; };
function topVal(e){
  const vals = e.sets.filter(hasData).map(s => num(e.k === 'lift' ? s.w : e.k === 'reps' ? s.r : null)).filter(v => v != null);
  return vals.length ? Math.max(...vals) : null;
}
function historyOf(name){
  return state.sessions.map(s => ({s, e:s.ex.find(x => x.n === name)})).filter(x => x.e && x.e.sets.some(hasData));
}
const hasData = s => s.done || s.w || s.r || s.v;
function fmtSet(s, k, u){
  if (k === 'lift') return (s.w || '–') + '×' + (s.r || '–') + (u === 'm' ? ' m' : '');
  if (k === 'reps') return s.r || '✓';
  return s.v || '✓';
}
function summary(e){ return e.sets.filter(hasData).map(s => fmtSet(s, e.k, e.u)).join(', '); }

/* ---------- views ---------- */
function render(){
  if (view.name === 'session' && state.active) return renderSession();
  if (view.name === 'detail') return renderDetail();
  if (view.name === 'backup') return renderBackup();
  if (view.name === 'progress') return renderProgress();
  if (view.name === 'lift') return renderLift();
  if (view.name === 'body') return renderBody();
  renderHome();
}

function renderHome(){
  const ws = weekStart();
  const thisWeek = state.sessions.filter(s => new Date(s.start) >= ws).length;
  const pips = [0,1,2,3].map(i => `<span class="pip ${i < thisWeek ? 'on' : ''}"></span>`).join('');
  const lastOf = k => state.sessions.find(s => s.key === k);
  let h = `<h1>Gym Log</h1><p class="sub">${new Date().toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'long'})}</p>
    <div class="week">${pips}<span>${thisWeek} of 3–4 this week</span></div>`;
  const dk = dayKey(dayOff), day = state.days[dk] || {};
  const dLabel = dayOff === 0 ? 'Today' : dayOff === -1 ? 'Yesterday' : fmtDate(dayDate(dk));
  h += `<section class="day" aria-label="Daily check-in">
    <div class="day-head"><button data-act="dayprev" aria-label="Previous day">‹</button><strong>${dLabel}</strong>
      <button data-act="daynext" aria-label="Next day" ${dayOff >= 0 ? 'disabled' : ''}>›</button></div>
    <div class="dayrow">
      <label class="field"><input data-day="w" value="${esc(day.w)}" placeholder="${esc(latestBefore('w', dk) || START_WEIGHT)}" inputmode="decimal" enterkeyhint="done" aria-label="Morning weight in kg"><em>kg</em></label>
      <label class="field"><input data-day="waist" value="${esc(day.waist)}" placeholder="${esc(latestBefore('waist', dk))}" inputmode="decimal" enterkeyhint="done" aria-label="Waist at belly button in cm"><em>cm waist</em></label>
    </div>
    <div class="habits">${HABITS.map(([k,l,s]) => `<button class="habit" data-act="habit" data-h="${k}" aria-pressed="${!!day[k]}">${l}<small>${s}</small></button>`).join('')}</div>
  </section>`;
  if (state.active){
    const a = state.active, done = a.ex.reduce((n,e) => n + e.sets.filter(s => s.done).length, 0);
    h += a.editing
      ? `<button class="resume" data-act="resume"><strong>Continue editing ${esc(PLAN[a.key].name)}</strong><span>From ${fmtDate(a.start)}</span></button>`
      : `<button class="resume" data-act="resume"><strong>Continue ${esc(PLAN[a.key].name)}</strong><span>Started ${new Date(a.start).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}, ${done} sets done</span></button>`;
  }
  h += `<div class="plates">` + Object.entries(PLAN).map(([k,p]) => {
    const l = lastOf(k);
    const sub = k === 'C' ? 'Optional 4th day, circuit' : p.ex.slice(0,3).map(e => e[0]).join(', ');
    return `<button class="plate" data-act="start" data-k="${k}" style="--pc:${p.color}">
      <span class="disc ${k==='C'?'c':''}" aria-hidden="true">${k}</span>
      <span><strong>Start ${esc(p.name)}</strong><span>${esc(sub)}</span><span>${l ? 'Last done ' + ago(l.start) : 'Not done yet'}</span></span></button>`;
  }).join('') + `</div>`;
  h += `<div class="backup" style="margin-top:14px"><button data-act="progress">Progress by exercise</button><button data-act="body">Body and habits</button></div>`;
  h += `<h2>History</h2>`;
  if (state.sessions.length){
    let cur = '';
    state.sessions.forEach(s => {
      const m = new Date(s.start).toLocaleDateString(undefined, {month:'long', year:'numeric'});
      if (m !== cur){ if (cur) h += `</div>`; h += `<h3 class="month">${m}</h3><div class="hist">`; cur = m; }
      const sets = s.ex.reduce((n,e) => n + e.sets.filter(hasData).length, 0);
      h += `<button data-act="detail" data-id="${s.id}">
        <span><span class="dot" style="background:${PLAN[s.key]?.color || 'var(--muted)'}"></span>${esc(PLAN[s.key]?.name || 'Workout')}<span class="meta">${sets} sets</span></span>
        <small>${fmtDate(s.start)}</small></button>`;
    });
    h += `</div>`;
  } else h += `<p class="empty">Finished workouts show up here, with every set you logged.</p>`;
  h += `<div class="backup"><button data-act="backup">Back up or restore</button></div>`;
  $app.innerHTML = h;
}

function renderSession(){
  const a = state.active, p = PLAN[a.key];
  let h = `<div class="top"><button class="back" data-act="home">‹ Home</button></div>
    <div class="title" style="--pc:${p.color}"><span class="disc ${a.key==='C'?'c':''}" aria-hidden="true">${a.key}</span><h1>${esc(p.name)}</h1></div>
    ${a.editing ? `<p class="sub">Editing the workout from ${fmtDate(a.start)}</p>` : ''}`;
  a.ex.forEach((e, ei) => {
    const last = lastFor(e.n);
    h += `<section class="ex"><div class="ex-head"><h3>${esc(e.n)}</h3><span class="target">${esc(e.t)}</span></div>
      <p class="focus">${esc(e.f)}</p>`;
    if (last) h += `<p class="last"><span>Last time: ${esc(last.map(s => fmtSet(s, e.k, e.u)).join(', '))}</span><button data-act="fill" data-ei="${ei}">Copy</button></p>`;
    e.sets.forEach((s, si) => {
      const ph = last ? (last[si] || last[last.length-1]) : null;
      h += `<div class="set ${e.k} ${s.done ? 'done' : ''}">
        <span class="num">${si+1}</span>`;
      if (e.k === 'lift') h += field(ei,si,'w',s.w, ph?.w, 'kg','decimal') + `<span class="x">×</span>` + field(ei,si,'r',s.r, ph?.r, e.u,'numeric');
      else if (e.k === 'reps') h += field(ei,si,'r',s.r, ph?.r, 'reps','numeric');
      else h += field(ei,si,'v',s.v, ph?.v || e.t, '','text');
      h += `<button class="tick" data-act="tick" data-ei="${ei}" data-si="${si}" aria-label="Mark set ${si+1} done" aria-pressed="${s.done}">✓</button>
        <button class="del" data-act="del" data-ei="${ei}" data-si="${si}" aria-label="Remove set ${si+1}">×</button></div>`;
    });
    h += `<button class="add" data-act="add" data-ei="${ei}">+ Add set</button></section>`;
  });
  h += `<div class="addex"><input id="newex" placeholder="Add an exercise" autocomplete="off"><button data-act="addex">Add</button></div>
    <div class="actions"><button class="primary" data-act="finish">${a.editing ? 'Save changes' : 'Finish workout'}</button>
    <button class="quiet ${armed==='discard'?'armed':''}" data-act="discard">${armed==='discard' ? 'Tap again to confirm' : a.editing ? 'Cancel edits' : 'Discard workout'}</button></div>`;
  $app.innerHTML = h;
}
function field(ei, si, f, val, ph, unit, mode){
  return `<label class="field"><input data-ei="${ei}" data-si="${si}" data-f="${f}" value="${esc(val)}" placeholder="${esc(ph || '')}" inputmode="${mode}" enterkeyhint="done" aria-label="${unit || 'value'}"><em>${esc(unit)}</em></label>`;
}

function renderDetail(){
  const s = state.sessions.find(x => x.id === view.id);
  if (!s){ view = {name:'home'}; return render(); }
  const p = PLAN[s.key];
  let h = `<div class="top"><button class="back" data-act="home">‹ Home</button></div>
    <div class="title" style="--pc:${p.color}"><span class="disc ${s.key==='C'?'c':''}" aria-hidden="true">${s.key}</span><h1>${esc(p.name)}</h1></div>
    <p class="sub">${fmtDate(s.start)}</p><div class="dl">`;
  const rows = s.ex.filter(e => e.sets.some(hasData));
  h += rows.length ? rows.map(e => `<div>${esc(e.n)}<small>${esc(summary(e))}</small></div>`).join('') : `<div>No sets logged.</div>`;

function renderProgress(){
  const seen = new Map();
  for (const s of state.sessions) for (const e of s.ex) if (e.sets.some(hasData)){
    if (!seen.has(e.n)) seen.set(e.n, {n:e.n, key:s.key, count:0, last:s.start});
    seen.get(e.n).count++;
  }
  const order = Object.keys(PLAN);
  const list = [...seen.values()].sort((a,b) => order.indexOf(a.key) - order.indexOf(b.key) || b.count - a.count);
  let h = `<div class="top"><button class="back" data-act="home">‹ Home</button></div><h1>Progress</h1>
    <p class="sub">Tap an exercise to see every session and how the weight has moved.</p>`;
  h += list.length
    ? `<div class="hist">` + list.map(x => `<button data-act="lift" data-n="${esc(x.n)}">
        <span><span class="dot" style="background:${PLAN[x.key]?.color || 'var(--muted)'}"></span>${esc(x.n)}<span class="meta">${x.count} ${x.count === 1 ? 'session' : 'sessions'}</span></span>
        <small>${ago(x.last)}</small></button>`).join('') + `</div>`
    : `<p class="empty">Finish a workout and your exercises appear here.</p>`;
  $app.innerHTML = h;
}

function renderLift(){
  const name = view.n, hist = historyOf(name);
  if (!hist.length){ view = {name:'progress'}; return render(); }
  const k = hist[0].e.k, u = hist[0].e.u;
  let h = `<div class="top"><button class="back" data-act="progress">‹ Progress</button></div><h1 style="font-size:28px">${esc(name)}</h1>
    <p class="sub">${hist.length} ${hist.length === 1 ? 'session' : 'sessions'}</p>`;

  // best set
  let best = null;
  for (const {s, e} of hist) for (const st of e.sets.filter(hasData)){
    const v = num(k === 'lift' ? st.w : st.r); if (v == null) continue;
    const r = num(st.r) || 0;
    if (!best || v > best.v || (v === best.v && k === 'lift' && r > best.r)) best = {v, r, st, d:s.start};
  }
  if (best && k !== 'time'){
    h += `<div class="best"><strong>${k === 'lift' ? `${best.st.w} kg × ${best.st.r || '–'}${u === 'm' ? ' m' : ''}` : `${best.st.r} reps`}</strong>
      <span>${k === 'lift' ? 'Heaviest set' : 'Most reps in a set'}, ${fmtDate(best.d)}</span></div>`;
  }

  // chart, oldest to newest
  const pts = hist.slice().reverse().map(({s, e}) => ({d:s.start, y:topVal(e)})).filter(p => p.y != null);
  if (k !== 'time'){
    if (pts.length >= 2){
      const W = 320, H = 150, L = 34, R = 10, T = 12, B = 22;
      let lo = Math.min(...pts.map(p => p.y)), hi = Math.max(...pts.map(p => p.y));
      if (lo === hi){ lo -= 5; hi += 5; }
      const pad = (hi - lo) * .1; lo -= pad; hi += pad;
      const x = i => L + (W - L - R) * (pts.length === 1 ? .5 : i / (pts.length - 1));
      const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
      const line = pts.map((p,i) => `${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join(' ');
      const short = d => new Date(d).toLocaleDateString(undefined, {day:'numeric', month:'short'});
      const r1 = v => Math.round(v * 2) / 2;
      h += `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${k === 'lift' ? 'Top weight' : 'Top reps'} per session">
        <line x1="${L}" x2="${W-R}" y1="${y(hi-pad)}" y2="${y(hi-pad)}" stroke="var(--line)"/>
        <line x1="${L}" x2="${W-R}" y1="${y(lo+pad)}" y2="${y(lo+pad)}" stroke="var(--line)"/>
        <text x="${L-6}" y="${y(hi-pad)+3}" text-anchor="end">${r1(hi-pad)}</text>
        <text x="${L-6}" y="${y(lo+pad)+3}" text-anchor="end">${r1(lo+pad)}</text>
        <polyline points="${line}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
        ${pts.map((p,i) => `<circle cx="${x(i)}" cy="${y(p.y)}" r="3.5" fill="var(--a)"/>`).join('')}
        <text x="${L}" y="${H-6}">${short(pts[0].d)}</text>
        <text x="${W-R}" y="${H-6}" text-anchor="end">${short(pts[pts.length-1].d)}</text>
      </svg><p class="note" style="margin:4px 4px 0">${k === 'lift' ? 'Top weight (kg)' : 'Most reps'} per session</p></div>`;
    } else h += `<p class="empty" style="margin-bottom:12px">The chart appears after your second session.</p>`;
  }

  // every session
  h += `<h2>Every session</h2><div class="dl">` + hist.map(({s, e}) =>
    `<div>${fmtDate(s.start)}<small>${esc(summary(e))}</small></div>`).join('') + `</div>`;
  $app.innerHTML = h;
}

function timeChart(pts, label){
  const W = 320, H = 150, L = 34, R = 10, T = 12, B = 22;
  let lo = Math.min(...pts.map(p => p.y)), hi = Math.max(...pts.map(p => p.y));
  if (lo === hi){ lo -= 1; hi += 1; }
  const pd = (hi - lo) * .15, t0 = pts[0].t, t1 = pts[pts.length-1].t;
  const x = t => L + (W - L - R) * ((t - t0) / ((t1 - t0) || 1));
  const y = v => T + (H - T - B) * (1 - (v - lo + pd) / (hi - lo + 2*pd));
  const short = t => new Date(t).toLocaleDateString(undefined, {day:'numeric', month:'short'});
  const r1 = v => Math.round(v * 10) / 10;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    <line x1="${L}" x2="${W-R}" y1="${y(hi)}" y2="${y(hi)}" stroke="var(--line)"/>
    <line x1="${L}" x2="${W-R}" y1="${y(lo)}" y2="${y(lo)}" stroke="var(--line)"/>
    <text x="${L-6}" y="${y(hi)+3}" text-anchor="end">${r1(hi)}</text>
    <text x="${L-6}" y="${y(lo)+3}" text-anchor="end">${r1(lo)}</text>
    <polyline points="${pts.map(p => x(p.t).toFixed(1) + ',' + y(p.y).toFixed(1)).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map(p => `<circle cx="${x(p.t)}" cy="${y(p.y)}" r="3.5" fill="var(--a)"/>`).join('')}
    <text x="${L}" y="${H-6}">${short(t0)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${short(t1)}</text>
  </svg><p class="note" style="margin:4px 4px 0">${esc(label)}</p></div>`;
}

function renderBody(){
  const keys = Object.keys(state.days).sort();
  const series = f => keys.map(k => ({k, t:dayDate(k).getTime(), y:num(state.days[k][f])})).filter(p => p.y != null);
  const wts = series('w'), waists = series('waist');
  const cutoff = keyOf(new Date(Date.now() - 6*864e5));
  const recent = wts.filter(p => p.k >= cutoff);
  const avg = recent.length ? recent.reduce((s,p) => s + p.y, 0) / recent.length : null;
  const since14 = new Date(Date.now() - 13*864e5); since14.setHours(0,0,0,0);
  const sess14 = state.sessions.filter(s => new Date(s.start) >= since14).length;
  const f1 = v => (Math.round(v * 10) / 10).toString();

  let h = `<div class="top"><button class="back" data-act="home">‹ Home</button></div><h1>Body and habits</h1>
    <p class="sub">Your two-week check-in, updated as you log.</p>
    <div class="checkin">
      <div><strong>${avg != null ? f1(avg) : '–'}</strong><span>kg, 7-day average</span></div>
      <div><strong>${avg != null ? (avg - START_WEIGHT > 0 ? '+' : '') + f1(avg - START_WEIGHT) : '–'}</strong><span>kg vs start (${START_WEIGHT})</span></div>
      <div><strong>${sess14}</strong><span>workouts in 14 days, aim 6–8</span></div>
    </div>`;
  if (waists.length) h += `<div class="best"><strong>${waists[waists.length-1].y} cm</strong><span>Waist, ${fmtDate(dayDate(waists[waists.length-1].k))}${waists.length > 1 ? `, ${f1(waists[waists.length-1].y - waists[0].y)} cm since ${fmtDate(dayDate(waists[0].k))}` : ''}</span></div>`;

  h += `<h2>Weight</h2>`;
  h += wts.length >= 2 ? timeChart(wts, 'Morning weight (kg)') : `<p class="empty" style="margin-bottom:12px">Log your morning weight on two days and the chart appears. Weigh after the toilet, before breakfast.</p>`;

  // habits, last 14 days
  const days14 = Array.from({length:14}, (_, i) => dayKey(i - 13));
  h += `<h2>Habits, last 14 days</h2><div class="grid">` + HABITS.map(([k,l,s]) => {
    const n = days14.filter(d => state.days[d]?.[k]).length;
    return `<div class="grow"><b>${l}</b>${days14.map(d => `<i class="${state.days[d]?.[k] ? 'on' : ''}" title="${d}"></i>`).join('')}<em>${n}/14</em></div>`;
  }).join('') + `<p class="note" style="margin:6px 0 0">Oldest on the left, today on the right.</p></div>`;

  const logged = keys.filter(k => { const d = state.days[k]; return d.w || d.waist || HABITS.some(([x]) => d[x]); }).reverse();
  if (logged.length){
    h += `<h2>Every day</h2><div class="dl">` + logged.map(k => {
      const d = state.days[k], bits = [];
      if (d.w) bits.push(d.w + ' kg'); if (d.waist) bits.push(d.waist + ' cm waist');
      const hb = HABITS.filter(([x]) => d[x]).map(([,l]) => l.toLowerCase());
      if (hb.length) bits.push(hb.join(', '));
      return `<div>${fmtDate(dayDate(k))}<small>${esc(bits.join('; '))}</small></div>`;
    }).join('') + `</div>`;
  }
  $app.innerHTML = h;
}

/* ---------- actions ---------- */
function arm(name){
  if (armed === name) return true;
  armed = name; clearTimeout(armTimer);
  armTimer = setTimeout(() => { armed = null; render(); }, 3000);
  render(); return false;
}

$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, ei = +b.dataset.ei, si = +b.dataset.si;
  const a = state.active;
  switch (act){
    case 'start':
      if (a && (a.editing || a.key !== b.dataset.k) && !arm('start' + b.dataset.k)) {
        toast(a.editing ? 'You have unsaved edits. Tap again to drop them.' : 'Workout in progress. Tap again to replace it.'); return; }
      if (!a || a.editing || a.key !== b.dataset.k) state.active = newSession(b.dataset.k);
      armed = null; view = {name:'session'}; save(); render(); scrollTo(0,0); break;
    case 'resume': view = {name:'session'}; render(); scrollTo(0,0); break;
    case 'home': armed = null; view = {name:'home'}; render(); scrollTo(0,0); break;
    case 'detail': view = {name:'detail', id:b.dataset.id}; render(); scrollTo(0,0); break;
    case 'backup': view = {name:'backup'}; render(); break;
    case 'progress': view = {name:'progress'}; render(); scrollTo(0,0); break;
    case 'body': view = {name:'body'}; render(); scrollTo(0,0); break;
    case 'dayprev': dayOff--; render(); break;
    case 'daynext': if (dayOff < 0) dayOff++; render(); break;
    case 'habit': {
      const k = dayKey(dayOff), d = state.days[k] = state.days[k] || {};
      d[b.dataset.h] = !d[b.dataset.h]; b.setAttribute('aria-pressed', d[b.dataset.h]); save(); break;
    }
    case 'lift': view = {name:'lift', n:b.dataset.n}; render(); scrollTo(0,0); break;
    case 'edit': {
      if (a && a.id !== view.id){ toast('Finish or discard the workout in progress first.'); return; }
      const s = state.sessions.find(x => x.id === view.id); if (!s) return;
      state.active = JSON.parse(JSON.stringify(s)); state.active.editing = true;
      state.active.ex.forEach(x => { if (!x.sets.length) x.sets = [newSet()]; });
      view = {name:'session'}; save(); render(); scrollTo(0,0); break;
    }
    case 'tick': {
      const ex = a.ex[ei], s = ex.sets[si];
      if (!s.done){
        const row = b.closest('.set');
        row.querySelectorAll('input').forEach(inp => { if (!inp.value && inp.placeholder && inp.dataset.f !== 'v') s[inp.dataset.f] = inp.placeholder; });
        s.done = true;
        if (ex.rest) startTimer(ex.rest);
      } else s.done = false;
      save(); render(); break;
    }
    case 'add': {
      const sets = a.ex[ei].sets, prev = sets[sets.length-1];
      sets.push(prev ? {w:prev.w, r:prev.r, v:'', done:false} : newSet()); save(); render(); break;
    }
    case 'del': a.ex[ei].sets.splice(si, 1); save(); render(); break;
    case 'fill': {
      const last = lastFor(a.ex[ei].n);
      a.ex[ei].sets.forEach((s, i) => { const l = last[i] || last[last.length-1]; if (!s.done){ s.w = l.w; s.r = l.r; s.v = l.v; } });
      save(); render(); break;
    }
    case 'addex': {
      const inp = document.getElementById('newex'), n = inp.value.trim();
      if (!n){ inp.focus(); return; }
      a.ex.push({n, t:'', f:'', k:'lift', rest:90, u:'reps', sets:[newSet(), newSet(), newSet()]}); save(); render(); break;
    }
    case 'finish': {
      a.ex.forEach(x => { const kept = x.sets.filter(hasData); x.sets = kept; });
      if (!a.ex.some(x => x.sets.length)){ toast('Log at least one set first.'); state.active.ex.forEach(x => { if (!x.sets.length) x.sets = [newSet()]; }); render(); return; }
      const wasEdit = a.editing; delete a.editing;
      a.end = a.end || new Date().toISOString();
      const i = state.sessions.findIndex(x => x.id === a.id);
      if (wasEdit && i >= 0) state.sessions[i] = a; else state.sessions.unshift(a);
      state.active = null; stopTimer();
      view = wasEdit ? {name:'detail', id:a.id} : {name:'home'};
      save(); clearTimeout(saveT); flush(); render(); scrollTo(0,0); toast(wasEdit ? 'Changes saved' : 'Workout saved'); break;
    }
    case 'discard': {
      if (!arm('discard')) return;
      const wasEdit = a.editing, id = a.id;
      state.active = null; armed = null; stopTimer();
      view = wasEdit ? {name:'detail', id} : {name:'home'};
      save(); render(); toast(wasEdit ? 'Edits cancelled' : 'Workout discarded'); break;
    }
    case 'delsess':
      if (!arm('delsess')) return;
      state.sessions = state.sessions.filter(s => s.id !== view.id); armed = null; view = {name:'home'}; save(); render(); toast('Workout deleted'); break;
    case 'copy': {
      const t = document.getElementById('bk'); t.select();
      (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => toast('Backup copied'), () => toast('Select the text and copy it manually'));
      break;
    }
    case 'restore': {
      if (!arm('restore')) { toast('Tap Restore again to replace your history'); return; }
      try {
        const d = JSON.parse(document.getElementById('bk').value);
        if (!Array.isArray(d.sessions)) throw 0;
        state = {sessions:d.sessions, active:d.active || null, days:d.days || {}, seededDoc:true}; armed = null; save(); view = {name:'home'}; render(); toast('History restored');
      } catch(err){ armed = null; toast("That text isn't a valid backup."); }
      break;
    }
  }
});

$app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.day){
    const k = dayKey(dayOff), d = state.days[k] = state.days[k] || {};
    d[t.dataset.day] = t.value.trim().replace(',', '.'); save(); return;
  }
  if (!t.dataset.f || !state.active) return;
  state.active.ex[+t.dataset.ei].sets[+t.dataset.si][t.dataset.f] = t.value.trim();
  save();
});
$app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newex'){ e.preventDefault(); document.querySelector('[data-act="addex"]').click(); }
  else if (e.key === 'Enter' && (e.target.dataset.f || e.target.dataset.day)) e.target.blur();
});

/* ---------- rest timer ---------- */
const $timer = document.getElementById('timer'), $tt = document.getElementById('tt');
function startTimer(sec){
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch(e){}
  timer.end = Date.now() + sec * 1000; timer.beeped = false;
  $timer.classList.add('show'); $timer.classList.remove('over');
  clearInterval(timer.iv); timer.iv = setInterval(tick, 250); tick();
}
function tick(){
  const left = Math.round((timer.end - Date.now()) / 1000);
  if (left <= 0){
    $tt.innerHTML = 'Go<small>next set</small>'; $timer.classList.add('over');
    if (!timer.beeped){ timer.beeped = true; beep(); }
    if (left < -20) stopTimer();
    return;
  }
  $tt.innerHTML = Math.floor(left/60) + ':' + String(left%60).padStart(2,'0') + '<small>rest</small>';
}
function stopTimer(){ clearInterval(timer.iv); $timer.classList.remove('show','over'); }
function beep(){
  if (!audio) return;
  try { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; g.gain.value = .15;
    o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + .25); } catch(e){}
}
$timer.addEventListener('click', e => {
  const b = e.target.closest('[data-t]'); if (!b) return;
  if (b.dataset.t === 'add'){ timer.end = Math.max(timer.end, Date.now()) + 30000; timer.beeped = false; $timer.classList.remove('over'); tick(); }
  else stopTimer();
});

    'Bike intervals':[['v','8 intervals (3 easy, 8 hard)']]}},
  {id:'doc-2026-09-26-B', key:'B', date:'2026-09-26T12:00:00', sets:{
    'Deadlift':[['30','12'],['35','10'],['35','10']],
    'Standing overhead press':[['24','12'],['24','11'],['28','9']],
    'Pull-ups or lat pulldown':[['40','12'],['45','12'],['50','10']],
    'Walking lunges':[['16','15'],['20','15'],['24','12']],

];
function seedImported(){
  if (state.seededDoc) return false;
  for (const im of IMPORTED){
    if (state.sessions.some(s => s.id === im.id)) continue;
    const start = new Date(im.date).toISOString();
    state.sessions.push({ id:im.id, key:im.key, start, end:start,
      ex: PLAN[im.key].ex.map(([n,t,f,k,sets,rest,u]) => ({ n,t,f,k,rest,u:u||'reps',
        sets:(im.sets[n] || []).map(([w,r]) => w === 'v' ? {w:'',r:'',v:r,done:true} : {w:w||'',r,v:'',done:true}) })) });
  }
  state.sessions.sort((a,b) => b.start.localeCompare(a.start));
  state.seededDoc = true;
  return true;
}

/* ---------- boot ---------- */
(async () => {
  const d = await store.get();
  if (d && Array.isArray(d.sessions)) state = {sessions:d.sessions, active:d.active || null, days:d.days || {}, seededDoc:!!d.seededDoc};
  if (seedImported()) await store.set(state);
  if (state.active) view = {name:'session'};
  render();
})();
</script>
